name: Build SDR2MQTT images

on:
  workflow_dispatch:
    inputs:
      version:
        description: Image tag to build
        type: string
        required: true
        default: edge
      publish:
        description: Publish the image to GHCR
        type: boolean
        required: true
        default: false
  release:
    types: [published]

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: sdr2mqtt

permissions:
  contents: read

jobs:
  init:
    name: Prepare build
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6

      - name: Prepare architecture matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@7412f0023ea9b6e58e8bb5059f1660f51376f49a
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}

  build:
    name: Build ${{ matrix.arch }}
    needs: init
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - name: Build image
        uses: home-assistant/builder/actions/build-image@7412f0023ea9b6e58e8bb5059f1660f51376f49a
        with:
          arch: ${{ matrix.arch }}
          context: ./sdr2mqtt
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ matrix.image }}
          image-tags: ${{ github.event.release.tag_name || inputs.version }}
          push: ${{ github.event_name == 'release' || inputs.publish }}
          version: ${{ github.event.release.tag_name || inputs.version }}

  manifest:
    name: Publish multi-architecture image
    if: ${{ github.event_name == 'release' || inputs.publish }}
    needs: [init, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish combined image
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@7412f0023ea9b6e58e8bb5059f1660f51376f49a
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: ${{ github.event.release.tag_name || inputs.version }}
